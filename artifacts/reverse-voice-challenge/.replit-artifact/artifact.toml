kind = "mobile"
previewPath = "/"
title = "ReVerse: Backwards Voice Challenge"
description = "A polished native iOS and Android voice-reversing game where players mimic backwards phrases, build streaks, unlock solo levels, and challenge custom prompts."
version = "1.0.0"
id = "artifacts/reverse-voice-challenge"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21783

[services.development]
run = "pnpm --filter @workspace/reverse-voice-challenge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reverse-voice-challenge", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/reverse-voice-challenge", "run", "serve" ]

[services.env]
PORT = "21783"
BASE_PATH = "/"
